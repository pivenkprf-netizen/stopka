<!DOCTYPE html>
<html lang="ru"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}

  font-family: "Optimistic Mono", ui-monospace, monospace;

</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PDF — сканер</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
async function getPDFBlob(){applyCrop(); let cv=document.getElementById('preview'); let data=cv.toDataURL('image/jpeg',0.9); const {jsPDF}=window.jspdf; let pdf=new jsPDF({orientation: cv.width>cv.height?'l':'p', unit:'mm', format:'a4'}); let pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); pdf.addImage(data,'JPEG',0,0,pw,ph); return pdf.output('blob');}
async function sharePDF(){if(!img.src){alert('Сначала выбери фото'); return} try{let blob=await getPDFBlob(); let file=new File([blob],'scan.pdf',{type:'application/pdf'}); if(navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file], title:'PDF — скан', text:'Мой скан'}); status.textContent='Отправлено ✓'; return;} // fallback - download then open share sheet
let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='scan.pdf'; a.click(); alert('PDF скачан. Теперь выбери Телеграм в меню Поделиться.'); }catch(e){alert('Не получилось поделиться, PDF скачан. Отправь его вручную в Телеграм.');}}
function shareTelegram(){makePDF(); setTimeout(()=>{window.open('https://t.me/share/url?url='+encodeURIComponent('Мой скан PDF — сделал в приложении PDF')+'&text='+encodeURIComponent('Мой скан PDF'));},300);}
function shareWhatsApp(){makePDF(); setTimeout(()=>{window.open('https://wa.me/?text='+encodeURIComponent('Мой скан PDF'));},300);}
</script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a1020;color:#fff}
header{padding:14px;text-align:center;font-weight:800;font-size:22px}
.wrap{padding:12px;max-width:640px;margin:auto}
.card{background:#141c36;border:1px solid #2c3968;border-radius:16px;padding:12px;margin-bottom:12px}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:700;margin:6px 0;cursor:pointer}
.primary{background:#25e3ff;color:#000}.green{background:#b8ff3d;color:#000}.ghost{background:#243158;color:#fff}
input[type=range]{width:100%}label{display:block;margin:10px 0 4px;color:#94a2cb}
#stage{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:260px;display:flex;align-items:center;justify-content:center}
#stage img,#stage video{max-width:100%;display:block}
.corner{position:absolute;width:36px;height:36px;border:3px solid #b8ff3d;border-radius:50%;background:rgba(184,255,61,.25);touch-action:none;z-index:5}
#preview{width:100%;border-radius:12px;background:#fff}
#status{color:#b8ff3d;text-align:center;padding:8px}
</style></head><body>
<header>PDF — сканер</header>
<div class="wrap">
<div class="card">
<button class="primary" onclick="document.getElementById('fileCam').click()">📷 Снять / Выбрать фото</button>
<input id="fileCam" type="file" accept="image/*" capture="environment" hidden>
<button class="ghost" onclick="document.getElementById('fileGal').click()">🖼️ Из галереи</button>
<input id="fileGal" type="file" accept="image/*" hidden>
<div id="status">Выбери фото — потом тяни углы</div>
<div id="stage"><span style="color:#888">Фото появится здесь</span></div>
</div>
<div class="card">
<label>Режим</label>
<select id="mode" onchange="apply()" style="width:100%;padding:12px;border-radius:10px;background:#0a1020;color:#fff">
<option value="orig">Оригинал</option><option value="bw">Чёрно-белый</option><option value="contrast">Контраст</option>
</select>
<label>Яркость <span id="vB">100</span></label><input id="bright" type="range" min="50" max="180" value="100" oninput="apply()">
<label>Контраст <span id="vC">100</span></label><input id="contrast" type="range" min="50" max="200" value="100" oninput="apply()">
<label>Резкость / Насыщенность <span id="vS">100</span></label><input id="sat" type="range" min="0" max="200" value="100" oninput="apply()">
</div>
<div class="card">
<button class="green" onclick="makePDF()">⬇️ Скачать PDF</button>
<button class="ghost" onclick="makeJPG()">⬇️ Скачать JPG</button>
<button class="primary" onclick="sharePDF()">📤 Поделиться в Телеграм / Мессенджеры</button>
<button class="ghost" onclick="shareTelegram()">✈️ Сразу в Телеграм</button>
<button class="ghost" onclick="shareWhatsApp()">💬 Сразу в WhatsApp</button>
<button class="ghost" onclick="saveArchive()">💾 В архив</button>
<div id="archive"></div>
</div>
<canvas id="preview" style="display:none"></canvas>
</div>
<script>
let img=new Image(), corners=[{x:10,y:10},{x:90,y:10},{x:90,y:90},{x:10,y:90}], cur=null;
const stage=document.getElementById('stage'), status=document.getElementById('status');
function loadFile(e){const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{img.onload=()=>{show()}; img.src=r.result}; r.readAsDataURL(f)}
document.getElementById('fileCam').onchange=loadFile; document.getElementById('fileGal').onchange=loadFile;
function show(){stage.innerHTML=''; let el=document.createElement('img'); el.id='mainImg'; el.src=img.src; el.style.filter=filterStr(); stage.appendChild(el);
corners.forEach((c,i)=>{let d=document.createElement('div'); d.className='corner'; d.dataset.i=i; positionCorner(d,c); stage.appendChild(d);
d.addEventListener('touchstart',e=>{cur=d; e.preventDefault()}); d.addEventListener('touchmove',e=>{if(!cur) return; let t=e.touches[0], r=stage.getBoundingClientRect(); let x=(t.clientX-r.left)/r.width*100, y=(t.clientY-r.top)/r.height*100; x=Math.max(0,Math.min(100,x)); y=Math.max(0,Math.min(100,y)); corners[i]={x,y}; positionCorner(d,corners[i]); applyCrop();}); d.addEventListener('touchend',()=>cur=null);
d.addEventListener('mousedown',()=>cur=d);}); 
document.addEventListener('mousemove',e=>{if(!cur) return; let r=stage.getBoundingClientRect(); let i=+cur.dataset.i; let x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100; corners[i]={x:Math.max(0,Math.min(100,x)), y:Math.max(0,Math.min(100,y))}; positionCorner(cur,corners[i]); applyCrop();});
document.addEventListener('mouseup',()=>cur=null);
status.textContent='Тяни зелёные кружки по углам листа'; applyCrop();}
function positionCorner(d,c){d.style.left='calc('+c.x+'% - 18px)'; d.style.top='calc('+c.y+'% - 18px)'}
function filterStr(){let b=document.getElementById('bright').value, c=document.getElementById('contrast').value, s=document.getElementById('sat').value; let m=document.getElementById('mode').value; let f=`brightness(${b}%) contrast(${c}%) saturate(${s}%)`; if(m=='bw') f+=' grayscale(100%)'; if(m=='contrast') f+=' contrast(130%)'; return f}
function apply(){document.getElementById('vB').textContent=document.getElementById('bright').value; document.getElementById('vC').textContent=document.getElementById('contrast').value; document.getElementById('vS').textContent=document.getElementById('sat').value; let im=document.getElementById('mainImg'); if(im) im.style.filter=filterStr(); applyCrop()}
function applyCrop(){if(!img.src) return; let cv=document.getElementById('preview'); let iw=img.naturalWidth, ih=img.naturalHeight; let pts=corners.map(c=>({x:c.x/100*iw, y:c.y/100*ih})); let w=Math.max(200, Math.hypot(pts[1].x-pts[0].x, pts[1].y-pts[0].y)); let h=Math.max(200, Math.hypot(pts[3].x-pts[0].x, pts[3].y-pts[0].y)); cv.width=w; cv.height=h; let ctx=cv.getContext('2d'); ctx.filter=filterStr(); ctx.drawImage(img, pts[0].x, pts[0].y, w, h, 0, 0, w, h); cv.style.display='block';}
function makePDF(){if(!img.src){alert('Сначала выбери фото'); return} applyCrop(); let cv=document.getElementById('preview'); let data=cv.toDataURL('image/jpeg',0.9); const {jsPDF}=window.jspdf; let pdf=new jsPDF({orientation: cv.width>cv.height?'l':'p', unit:'mm', format:'a4'}); let pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); pdf.addImage(data,'JPEG',0,0,pw,ph); pdf.save('scan.pdf'); status.textContent='PDF скачан ✓'}
function makeJPG(){if(!img.src){alert('Сначала выбери фото'); return} applyCrop(); let a=document.createElement('a'); a.href=document.getElementById('preview').toDataURL('image/jpeg',0.92); a.download='scan.jpg'; a.click()}
function saveArchive(){if(!img.src) return; applyCrop(); let d=document.getElementById('preview').toDataURL('image/jpeg',0.85); let im=document.createElement('img'); im.src=d; im.style.cssText='width:100%;border-radius:10px;margin-top:8px'; document.getElementById('archive').appendChild(im); status.textContent='Сохранено в архив на этой странице ✓'}

async function getPDFBlob(){applyCrop(); let cv=document.getElementById('preview'); let data=cv.toDataURL('image/jpeg',0.9); const {jsPDF}=window.jspdf; let pdf=new jsPDF({orientation: cv.width>cv.height?'l':'p', unit:'mm', format:'a4'}); let pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(); pdf.addImage(data,'JPEG',0,0,pw,ph); return pdf.output('blob');}
async function sharePDF(){if(!img.src){alert('Сначала выбери фото'); return} try{let blob=await getPDFBlob(); let file=new File([blob],'scan.pdf',{type:'application/pdf'}); if(navigator.canShare && navigator.canShare({files:[file]})){await navigator.share({files:[file], title:'PDF — скан', text:'Мой скан'}); status.textContent='Отправлено ✓'; return;} // fallback - download then open share sheet
let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='scan.pdf'; a.click(); alert('PDF скачан. Теперь выбери Телеграм в меню Поделиться.'); }catch(e){alert('Не получилось поделиться, PDF скачан. Отправь его вручную в Телеграм.');}}
function shareTelegram(){makePDF(); setTimeout(()=>{window.open('https://t.me/share/url?url='+encodeURIComponent('Мой скан PDF — сделал в приложении PDF')+'&text='+encodeURIComponent('Мой скан PDF'));},300);}
function shareWhatsApp(){makePDF(); setTimeout(()=>{window.open('https://wa.me/?text='+encodeURIComponent('Мой скан PDF'));},300);}
</script><script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
